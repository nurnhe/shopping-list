<body>
<title>Shopping List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* One list for every shop: what Household Diary is running low on, what Skin Diary wants to buy, the week's groceries from
   Meal Planner, and anything typed in here. Look: warm paper, deep teal and apricot, flat cards. Bricolage Grotesque for headings, Figtree for the rest. */
:root {
  --bg: #FAF6EF; --bg-2: #F4EEE3;
  --surface: #FFFFFF; --surface-2: #FCFAF6; --ink: #2B2E33; --muted: #7A7D82; --line: rgba(43, 46, 51, .11);
  --accent: #2B7A78; --accent-ink: #FFFFFF; --accent-soft: #E1F0EE; --sun: #F2A65A; --sun-soft: #FDEEDC;
  --warn: #C2553A; --ok: #2B7A78;
  --g-groceries: #E39A3B; --g-household: #4F9A6E; --g-care: #CF6F8A; --g-other: #7C86B8;
  --shadow: 0 1px 0 rgba(30, 30, 30, .04), 0 6px 18px rgba(30, 30, 30, .06);
  --shadow-lg: 0 18px 50px rgba(30, 30, 30, .22);
  --head: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --sans: "Figtree", "Avenir Next", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1F22; --bg-2: #20252A; --surface: #262C31; --surface-2: #2C3338; --ink: #F1EDE6; --muted: #A6ADB3; --line: rgba(241, 237, 230, .14);
  --accent: #7FCBC6; --accent-ink: #0F2524; --accent-soft: #1F3836; --sun: #F0B271; --sun-soft: #3A2D1E; --warn: #EB977F; --ok: #7FCBC6;
  --g-groceries: #EDB168; --g-household: #86C79E; --g-care: #E59AB0; --g-other: #A4ADDB;
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="light"] { color-scheme: light }
:root[data-theme="dark"] {
  --bg: #1B1F22; --bg-2: #20252A; --surface: #262C31; --surface-2: #2C3338; --ink: #F1EDE6; --muted: #A6ADB3; --line: rgba(241, 237, 230, .14);
  --accent: #7FCBC6; --accent-ink: #0F2524; --accent-soft: #1F3836; --sun: #F0B271; --sun-soft: #3A2D1E; --warn: #EB977F; --ok: #7FCBC6;
  --g-groceries: #EDB168; --g-household: #86C79E; --g-care: #E59AB0; --g-other: #A4ADDB;
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html { min-height: 100% }
body { margin: 0; min-height: 100%; color: var(--ink); font: 400 15px/1.5 var(--sans); background: linear-gradient(180deg, var(--bg), var(--bg-2)) fixed; background-color: var(--bg) }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 26px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px }
h1, h2, h3 { margin: 0; font-family: var(--head); text-wrap: balance }
h1 { font-size: clamp(34px, 7vw, 50px); font-weight: 650; line-height: 1; letter-spacing: -.03em }
h1 em { font-style: normal; color: var(--accent); position: relative; isolation: isolate }
h1 em::after { content: ""; position: absolute; left: -.04em; right: -.04em; bottom: .04em; height: .2em; border-radius: 99px; background: var(--sun); opacity: .55; z-index: -1 }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow) }

header.top { display: flex; align-items: start; justify-content: space-between; gap: 12px }
.brand { display: grid; gap: 8px; min-width: 0 }
.summary { font-size: 14.5px; color: var(--muted); font-weight: 500 }
.summary b { color: var(--ink); font-weight: 700 }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 12px; transition: border-color .2s, color .2s }
.icon-btn:hover { border-color: var(--accent); color: var(--accent) }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.top-btns { display: flex; gap: 8px }

a.btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; transition: border-color .2s, background .2s, color .2s; white-space: nowrap }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primary:hover { filter: brightness(1.05); color: var(--accent-ink) }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 9px }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--accent); border-color: var(--line) }

/* Add bar */
.add { display: flex; gap: 8px; padding: 8px; align-items: center }
.add input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 10px; font-size: 16px; outline: none }
.add .guess { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px }
.add .guess:empty { display: none }

/* Filter chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px }
.chips::-webkit-scrollbar { display: none }
.chip { --c: var(--accent); display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap }
.chip .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7 }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none }

/* Connected apps strip */
.apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px }
.app-card { --c: var(--accent); display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; text-decoration: none; color: inherit; transition: border-color .2s }
.app-card:hover { border-color: var(--c) }
.app-card .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: color-mix(in srgb, var(--c) 80%, var(--ink)) }
.app-card .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.app-card .nm { font-weight: 700; font-size: 14.5px }
.app-card .sub { font-size: 13px; color: var(--muted); line-height: 1.35 }
.app-card .go { color: var(--muted); font-size: 18px }

/* Groups and items */
.groups { display: grid; gap: 14px }
.group { --c: var(--g-other); padding: 14px 10px 8px 14px; box-shadow: var(--shadow), inset 4px 0 0 var(--c) }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 6px 6px 4px }
.group-head .count { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums }
.items { list-style: none; margin: 0; padding: 0; display: grid }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 6px 9px 4px; border-top: 1px solid var(--line) }
.items > .item:first-child, .items > .aisle + .item { border-top: 0 }
.aisle { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 4px 2px; border-top: 1px solid var(--line) }
.items > .aisle:first-child { border-top: 0; padding-top: 0 }
.aisle.pantry::after { content: " · spices and oil you may already have"; text-transform: none; letter-spacing: 0; font-weight: 500 }
.item .check { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 8px; border: 1.75px solid color-mix(in srgb, var(--muted) 70%, transparent); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.item .check::after { content: "✓"; font-size: 14px; font-weight: 700; line-height: 1; color: var(--accent-ink); opacity: 0 }
.item .check:checked { background: var(--ok); border-color: var(--ok) }
.item .check:checked::after { opacity: 1 }
.item .body { min-width: 0; border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 1px }
.item .nm { font-weight: 600; overflow-wrap: anywhere }
.item .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.item .amt { font-size: 13.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--t, var(--muted)) 85%, var(--ink)) }
.tag svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tag.warn { color: var(--warn) }
.item.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.item .side { display: flex; align-items: center; gap: 6px }

.soon { padding: 14px 14px 10px; background: var(--sun-soft); border-color: color-mix(in srgb, var(--sun) 35%, var(--line)) }
.soon .items .item { grid-template-columns: minmax(0, 1fr) auto; border-color: color-mix(in srgb, var(--sun) 25%, var(--line)) }
.basket { padding: 14px 14px 8px }
.basket summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.basket summary::-webkit-details-marker { display: none }
.basket summary h2::after { content: " ›"; color: var(--muted); display: inline-block; transition: transform .2s }
.basket[open] summary h2::after { transform: rotate(90deg) }
.basket .items { margin-top: 6px }
.basket .item { grid-template-columns: minmax(0, 1fr) auto }

.views { display: flex; gap: 4px; padding: 4px; background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 12px; width: max-content }
.views button { border: 0; background: none; border-radius: 9px; padding: 7px 18px; font-weight: 700; color: var(--muted) }
.views button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.item .amt .price { display: block; color: var(--ink) }
.item .amt .price.guess::before { content: "≈ "; color: var(--muted) }
.item .amt .qty { display: block; font-weight: 600 }
.qp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.stepper { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px }
.stepper button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; font-size: 18px; font-weight: 700; color: var(--ink) }
.stepper .input { text-align: center; padding-inline: 4px }
.total-line { margin: 0; font-weight: 700; font-size: 16px }
.total-line span { color: var(--muted); font-weight: 500 }
.spend-head { padding: 18px; display: grid; gap: 14px }
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.month h2 { font-size: 20px }
.big { font-family: var(--head); font-size: clamp(36px, 9vw, 48px); font-weight: 650; letter-spacing: -.03em; line-height: 1 }
.big small { font-size: .42em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px }
.bars { display: grid; gap: 12px }
.bar { --c: var(--g-other); display: grid; gap: 5px; border: 0; background: none; padding: 0; text-align: left; width: 100% }
.bar .lbl { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 14.5px }
.bar .lbl span:last-child { font-variant-numeric: tabular-nums }
.bar .lbl .pct { color: var(--muted); font-weight: 500; margin-left: 6px }
.bar .track { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--c) 14%, var(--surface-2)); overflow: hidden }
.bar .fill { height: 100%; border-radius: 99px; background: var(--c); min-width: 4px }
.bar[aria-pressed="true"] .lbl { color: var(--c) }
.pays { padding: 12px 10px 6px 14px }
.pays .day { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 4px 2px; border-top: 1px solid var(--line) }
.pays .items > .day:first-child { border-top: 0; padding-top: 2px }
.pays .item { grid-template-columns: 12px minmax(0, 1fr) auto }
.pays .items > .day + .item { border-top: 0 }
.pays .item .dot { --c: var(--g-other) }
.nopay { color: var(--warn) }
.empty { padding: 28px 22px; text-align: center; display: grid; gap: 10px; justify-items: center }
.empty h2 { font-size: 22px }
.empty p { margin: 0; max-width: 52ch }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 0 }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(15, 18, 20, .38); z-index: 30; display: grid; align-items: end; justify-items: center; animation: fade .2s }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: var(--shadow-lg); animation: up .25s cubic-bezier(.2, .8, .3, 1) }
@media (min-width: 701px) { .scrim { align-items: center } .sheet { border-radius: 20px } }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); justify-self: center; margin-top: -6px }
.sheet h2 { font-size: 22px }
.sheet label.f { display: grid; gap: 6px; font-weight: 600; font-size: 13.5px; color: var(--muted) }
.input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--ink); width: 100% }
.seg { display: flex; flex-wrap: wrap; gap: 8px }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.row .spacer { margin-right: auto }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.setting .nm { font-weight: 600 }
.setting .sub { font-size: 13px; color: var(--muted) }
.setting.wide { grid-template-columns: 1fr }
.switch { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0 }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s }
.switch:checked { background: var(--accent) }
.switch:checked::after { transform: translateX(18px) }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-lg); font-weight: 500; animation: up .25s }
.toast button { border: 0; background: none; color: var(--sun); font-weight: 700; padding: 4px 8px }
@keyframes up { from { transform: translateY(24px); opacity: 0 } }
@keyframes fade { from { opacity: 0 } }
.toast { animation-name: toastIn }
@keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
@media (max-width: 520px) { .app-card .sub { font-size: 12.5px } .item .amt { max-width: 34vw; white-space: normal } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Shopping <em>list</em></h1>
      <div class="summary" id="summary"></div>
    </div>
    <div class="top-btns">
      <button class="icon-btn" data-act="share" aria-label="Copy or share the list" title="Copy or share the list"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button class="icon-btn" data-act="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="icon-btn" data-act="theme" id="themeBtn"></button>
    </div>
  </header>
  <nav class="views" role="tablist" aria-label="View">
    <button role="tab" data-act="view" data-v="list" aria-selected="true">List</button>
    <button role="tab" data-act="view" data-v="spend" aria-selected="false">Spending</button>
  </nav>
  <form class="add card" data-form="add" autocomplete="off">
    <input id="addInput" placeholder="Add something to buy…" aria-label="Add something to buy" enterkeyhint="done">
    <span class="guess" id="guess"></span>
    <button class="btn primary">Add</button>
  </form>
  <main id="main" style="display:grid;gap:14px"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
/* ---------- the other apps' saved data (same site, so same localStorage) ---------- */
const KEYS = { household: "household-diary-v1", skin: "skin-diary-v1", meals: "meal-planner", mine: "shopping-list-v1" };
const APP_URL = { household: "../household-diary/", skin: "../skin-diary/", meals: "../meal-planner/" };
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k) || "null") } catch (e) { return null } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch (e) { toast("Couldn't save on this device. Free up some browser storage and try again."); return false } };
const raw = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const restore = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };

/* ---------- dates (local YYYY-MM-DD, like the other apps) ---------- */
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const todayKey = () => keyOf(new Date());
const keyAdd = (k, n) => keyOf(addDays(fromKey(k), n));
const dayNum = k => { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5) };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const ymd = keyOf;
const daysAgo = k => dayNum(todayKey()) - dayNum(k);
const agoLabel = k => { const n = daysAgo(k); return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago` };
const inDays = k => { const n = -daysAgo(k); return n <= 0 ? "now" : n === 1 ? "tomorrow" : `in ${n} days` };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- reading Meal Planner ingredients (copied from Meal Planner so the totals match exactly) ---------- */
let lang = "en";
const L = () => (lang === "ru" ? 1 : 0);
const LOCALE = () => (lang === "ru" ? "ru-RU" : "en-GB");
const cap = s => s ? s[0].toLocaleUpperCase() + s.slice(1) : s;
/* ---------- reading ingredient lines ---------- */
/* Units: canonical key → English label (singular, plural), Russian label, and the spellings people use in both languages. */

  l: ["l", "л", "l|litre|litres|liter|liters|л|литр|литра|литров"],
  tbsp: ["tbsp", "ст. л.", "tbsp|tbsps|tbs|tablespoon|tablespoons|ст.л.|ст. л.|ст л|ст. ложки|ст. ложка|ст. ложку|ст.ложки|столовая ложка|столовые ложки|столовых ложки|столовых ложек|столовой ложки|столовую ложку"],

  clove: ["clove|cloves", "зубч.", "clove|cloves|зубчик|зубчика|зубчиков|зубчиков|зуб."],
  pinch: ["pinch|pinches", "щеп.", "pinch|pinches|щепотка|щепотки|щепоток|щепотку|щеп."],
  can: ["can|cans", "банк.", "can|cans|tin|tins|банка|банки|банок|банку"],
  bunch: ["bunch|bunches", "пуч.", "bunch|bunches|пучок|пучка|пучков"],
  slice: ["slice|slices", "ломт.", "slice|slices|ломтик|ломтика|ломтиков|ломтя"],
  pack: ["pack|packs", "уп.", "pack|packs|packet|packets|упаковка|упаковки|упаковок|уп.|пачка|пачки|пачек"],
  head: ["head|heads", "кочан", "head|heads|кочан|кочана|кочанов|головка|головки"],
  handful: ["handful|handfuls", "горсть", "handful|handfuls|горсть|горсти"],

const UNIT_ALIAS = {};
for (const [k, [, , words]] of Object.entries(UNITS)) for (const w of words.split("|")) if (w) UNIT_ALIAS[w.toLowerCase()] = k;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const UNIT_ALT = Object.keys(UNIT_ALIAS).filter(Boolean).sort((a, b) => b.length - a.length).map(reEsc).join("|");

const FRAC = { "½": .5, "⅓": 1 / 3, "⅔": 2 / 3, "¼": .25, "¾": .75, "⅛": .125 };
const NUM = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+[.,]\\d+|\\d+\\s?[½⅓⅔¼¾⅛]|\\d+|[½⅓⅔¼¾⅛])";
const QTY_RE = new RegExp(`^(${NUM})(?:\\s*(?:-|–|—|to|до)\\s*(${NUM}))?\\s*`, "i");
const TRAIL_RE = new RegExp(`^(.*?[a-zа-яё)][^\\d]*?)\\s+(${NUM})\\s*(${UNIT_ALT})?\\.?\\s*$`, "i");
const TO_TASTE_RE = /to taste|по вкусу|optional|по желанию|for serving|to serve|для подачи/i;
const NO_QTY_UNITS = new Set(["pinch", "bunch", "handful"]);

function toNum(s) {
  s = s.trim();
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if ((m = s.match(/^(\d+)\s?([½⅓⅔¼¾⅛])$/))) return +m[1] + FRAC[m[2]];
  if (FRAC[s]) return FRAC[s];

}
function cleanLine(s) {
  return s.replace(/\*\*|__|`/g, "").replace(/^\s*(?:[-*•·▪◦–—]|\[\s?\]|\d+[.)](?=\s))\s*/, "").replace(/^\s*\*\s+/, "").trim();
}
function parseAmount(s) {
  s = s.trim();
  let qty = null, unit = null, rest = s;
  const q = rest.match(QTY_RE);
  if (q && q[0].trim()) { qty = toNum(q[2] || q[1]); rest = rest.slice(q[0].length) }
  const adj = rest.match(/^(?:крупн|средн|небольш|больш|маленьк|large|medium|small|big)\p{L}*\s+/iu);
  const u = rest.slice(adj ? adj[0].length : 0).match(UNIT_RE);
  if (u && adj) rest = rest.slice(adj[0].length);
  if (u && (qty != null || NO_QTY_UNITS.has(UNIT_ALIAS[u[1].toLowerCase()]))) {
    unit = UNIT_ALIAS[u[1].toLowerCase()];
    if (qty == null) qty = 1;
    rest = rest.slice(u[0].length);

  if (qty == null) return null;
  rest = rest.replace(/^\s*(?:of|x|×)\s+/i, "").trim();

  return s.replace(/\([^)]*\)/g, " ").split(/,|;|\s[—–-]\s/)[0].replace(TO_TASTE_RE, "").replace(/\s+(?:and|и)\s*$/i, "").replace(/[.:]+$/, "").replace(/\s+/g, " ").trim();
}
/* Reads "200 g spaghetti", "2 chicken breasts, diced", "Творог — 400 г", "Мука 3 ст. л.", "Salt and pepper, to taste". */
function parseIngredient(raw) {
  const s = cleanLine(raw);
  let name = s, rest = s, amt = null;
  const d = s.match(/^(.+?)\s+[—–-]\s+(.+)$/) || s.match(/^([^:\d]+?):\s*(.+)$/);
  if (d && /[a-zа-яё]/i.test(d[1])) {
    name = rest = d[1];
    amt = parseAmount(d[2]);
    if (!amt) rest = s;
  }
  if (!amt && !d) {
    const a = parseAmount(s);
    if (a && a.rest) { amt = a; name = rest = a.rest }
  }
  if (!amt && !d) {
    const m = s.match(TRAIL_RE);
    if (m) { const unit = m[3] ? UNIT_ALIAS[m[3].toLowerCase()] : null; amt = { qty: toNum(m[2]), unit }; name = rest = m[1] }
  }
  const qty = amt?.qty ?? null;
  return { qty: Number.isFinite(qty) ? qty : null, unit: amt?.unit || null, name: tidyName(name) || s, rest: rest.trim(), toTaste: TO_TASTE_RE.test(s), raw: s };
}

const STEM_RE = Object.fromEntries(Object.entries(STEMS).map(([k, v]) => [k, new RegExp(`(^|[^a-zа-я])(${v.split(" ").join("|")})`)]));

const low = s => s.toLowerCase().replace(/ё/g, "е");
function sectionOf(name) {
  const s = low(name);
  for (const [p, sec] of SPECIFIC) if (s.includes(p)) return sec;

const isWater = name => /(^|\s)(water|вода|воды|воду|кипяток|кипятка)(\s|$)/.test(low(name)) && low(name).split(" ").length <= 2;

    if (/[а-я]/.test(w)) return w.length > 3 ? w.replace(/[аяоеиыуюйь]+$/, "") : w;
    if (w.length <= 3) return w;

/* ---------- this app's own data ---------- */
let mine = { items: {}, log: [], meta: {}, prices: {}, settings: { household: true, skin: true, meals: "off", currency: "RSD" } };
function loadMine() {
  const d = readJSON(KEYS.mine) || {};
  mine = { items: d.items || {}, log: d.log || [], meta: d.meta || {}, prices: d.prices || {}, settings: { household: true, skin: true, meals: "off", currency: "RSD", ...(d.settings || {}) } };
  mine.log.forEach(x => { x.id ||= uid() });
  /* One-off (asked 2026-11-24): KK wants Meal Planner groceries off for now. Settings → Meal Planner turns them back on. */
  try { if (!localStorage.getItem("shopping-list-meals-off")) { localStorage.setItem("shopping-list-meals-off", "1"); mine.settings.meals = "off"; saveMine() } } catch (e) {}

const saveMine = () => writeJSON(KEYS.mine, mine);
/* Prices: each item can carry a quantity and a price each (mine.meta, by list item). The last price paid for a name is
   remembered (mine.prices) and suggested next time. Every purchase goes into mine.log, which the Spending view totals. */
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) && n >= 0 ? n : null };
const pkey = n => String(n).trim().toLowerCase();
const r2 = v => Math.round(v * 100) / 100;
function metaOf(i) {
  const m = mine.meta[i.id] || {}, qty = m.qty ?? 1, last = mine.prices[pkey(i.name)], price = m.price ?? last ?? null;
  return { qty, price, total: price == null ? null : r2(price * qty), guessed: m.price == null && price != null };
}

const money = v => v == null ? "" : new Intl.NumberFormat("en-GB", { minimumFractionDigits: r2(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(r2(v)) + " " + (mine.settings.currency || "");

function logBought(item) {
  const m = metaOf(item);
  mine.log = [{ id: uid(), name: item.name, group: item.group, src: item.src, on: todayKey(), at: Date.now(), qty: m.qty, price: m.price, total: m.total }, ...mine.log].slice(0, 3000);

/* ---------- which group something belongs in ---------- */
const GROUPS = { groceries: "Groceries", household: "Household", care: "Skin & personal care", other: "Other" };
const GROUP_ORDER = ["household", "care", "groceries", "other"];
const CARE_RE = /serum|cream|crème|spf|sunscreen|sun screen|cleanser|toner|essence|moistur|retinol|retinal|niacinamide|acid|mask|balm|lip|shampoo|conditioner|hair|tooth|floss|mouthwash|deodorant|razor|shav|cotton pad|cotton bud|q-tip|make ?up|mascara|micellar|body lotion|lotion|shower gel|body wash|hand cream|perfume|nail|tampon|pad|sanitary|сыворот|крем|шампун|бальзам|маск|тоник|зубн|дезодор/i;

function guessGroup(name) {
  if (CARE_RE.test(name)) return "care";

/* ---------- gather everything to buy ---------- */
const HOUSE_CARE_AREAS = new Set(["Personal care"]);
function householdData() { const d = readJSON(KEYS.household); return d && (d.supplies || d.chores) ? { chores: d.chores || {}, supplies: d.supplies || {}, shopping: d.shopping || {} } : null }
function skinData() { const d = readJSON(KEYS.skin); return d && d.template ? d : null }
function mealsData() { const d = readJSON(KEYS.meals); return d && Array.isArray(d.recipes) ? d : null }

function mealWeek() {
  const now = today0(), mon = mondayOf(now);
  if (mine.settings.meals === "next") return { key: ymd(addDays(mon, 7)), days: [...Array(7)].map((_, i) => ymd(addDays(mon, 7 + i))) };
  return { key: ymd(mon), days: [...Array(7)].map((_, i) => addDays(mon, i)).filter(d => d >= now).map(ymd) };
}
function mealItems(md) {
  lang = md.lang || "en";
  const byId = id => md.recipes.find(r => r.id === id), items = new Map(), { key, days } = mealWeek();
  for (const k of days) for (const meal of MEAL_SLOTS) {
    const e = md.plan?.[k]?.[meal], r = e && byId(e.r);
    if (!r) continue;
    const f = (e.s || r.servings || 1) / (r.servings || e.s || 1);
    for (const line of r.ingredients || []) {
      if (!line.trim()) continue;
      const p = parseIngredient(line);
      if (isWater(p.name)) continue;
      const ik = itemKey(p.name);
      if (!ik) continue;
      let it = items.get(ik);
      if (!it) items.set(ik, it = { key: ik, name: cap(p.name), section: sectionOf(p.name), amounts: {}, loose: false, recipes: new Set() });
      it.recipes.add(r.name);
      if (p.qty == null) { if (/to taste|по вкусу/i.test(p.raw)) it.taste = true; it.loose = true; continue }
      const [bu, mul] = BASE[p.unit] || [p.unit || "pcs", 1];
      it.amounts[bu] = (it.amounts[bu] || 0) + p.qty * mul * f;
    }
  }
  const store = md.shop?.[key] || { checked: {}, extra: [] }, out = [];
  for (const it of items.values()) {
    it.amount = Object.entries(it.amounts).map(([u, q]) => fmtAmount(q, u === "pcs" ? null : u, true)).join(" + ");
    if (!it.amount && it.loose && it.section !== "pantry" && /^(salt|pepper|соль|перец)/i.test(it.name)) it.section = "pantry";
    if (store.checked?.[it.key]) continue;
    out.push({ id: "m:" + it.key, src: "meals", group: "groceries", name: it.name, amount: it.amount || (it.taste ? "to taste" : ""),
      aisle: it.section, sub: [[forLabel([...it.recipes]), ""]], sort: AISLE_ORDER.indexOf(it.section) });
  }
  for (const x of store.extra || []) if (!x.done) out.push({ id: "mx:" + x.id, src: "meals", group: "groceries", name: x.text, aisle: "other", sub: [["Also buy, from Meal Planner", ""]], sort: AISLE_ORDER.indexOf("other") });
  return out;
}

function gather() {
  const out = [], soon = [], hd = mine.settings.household && householdData(), sd = mine.settings.skin && skinData(), md = mine.settings.meals !== "off" && mealsData();
  if (hd) {
    const t = todayKey();
    for (const s of Object.values(hd.supplies)) {
      const group = HOUSE_CARE_AREAS.has(s.area) ? "care" : "household";
      if (s.low) out.push({ id: "h:" + s.id, src: "household", group, name: s.name, sub: [[s.area, ""], [s.lowSince ? `running low since ${agoLabel(s.lowSince)}` : "running low", ""]], sort: 0 });
      else if (s.bought && s.lasts) { const end = keyAdd(s.bought, s.lasts); if (dayNum(end) - dayNum(t) <= 5) soon.push({ id: s.id, name: s.name, area: s.area, end }) }
    }
    for (const x of Object.values(hd.shopping).sort((a, b) => (a.added || 0) - (b.added || 0))) out.push({ id: "hx:" + x.id, src: "household", group: guessGroup(x.name) === "care" ? "care" : "household", name: x.name, sub: [["Added in Household Diary", ""]], sort: 1 });
  }
  if (sd) {
    const prods = sd.template.products || [];

/* ---------- ticking something off: write back to the app it came from ---------- */
/* Each change keeps a copy of what it touched, so Undo puts it back exactly. */
function snapshot(...keys) { const snap = keys.map(k => [k, raw(k)]); return () => { snap.forEach(([k, v]) => restore(k, v)); loadMine(); render() } }
function tickItem(id) {
  const [kind, ...rest] = id.split(":"), ref = rest.join(":"), g = gather(), item = g.items.find(x => x.id === id);
  if (!item) { render(); return }
  const touched = { h: KEYS.household, hx: KEYS.household, s: KEYS.skin, m: KEYS.meals, mx: KEYS.meals, o: null }[kind];
  const undo = snapshot(...[touched, KEYS.mine].filter(Boolean));
  let msg = `Ticked off ${item.name}.`;
  if (kind === "h") msg = householdBought(ref) || msg;
  else if (kind === "hx") { const d = readJSON(KEYS.household); delete d.shopping[ref]; writeJSON(KEYS.household, d) }

  else if (kind === "m" || kind === "mx") {
    const d = readJSON(KEYS.meals), { key } = mealWeek(), st = (d.shop ||= {})[key] ||= { checked: {}, extra: [] };
    if (kind === "m") (st.checked ||= {})[ref] = true; else { const x = (st.extra || []).find(x => x.id === ref); if (x) x.done = true }
    writeJSON(KEYS.meals, d);

}
/* Same as Household Diary's "bought": it learns how long a supply really lasts from when it was bought to when it ran low. */
function householdBought(id) {
  const d = readJSON(KEYS.household), prev = d?.supplies?.[id]; if (!prev) return;
  const t = todayKey(), s = { ...prev, bought: t };

  if (used >= 3) { s.used = [...(prev.used || []), used].slice(-3); s.lasts = Math.round(s.used.reduce((a, b) => a + b, 0) / s.used.length) }
  delete s.low; delete s.lowSince; d.supplies[id] = s; writeJSON(KEYS.household, d);
  return s.lasts ? `Bought ${s.name}. Household Diary will remind you around ${fromKey(keyAdd(t, s.lasts - 5)).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}.` : `Bought ${s.name}.`;
}

}
/* Same as Skin Diary's "Bought it": a restock puts the finished product back in use, anything new goes on the shelf. */
function skinBought(id) {
  const d = readJSON(KEYS.skin), tpl = d?.template, b = (tpl?.toBuy || []).find(x => x.id === id); if (!b) return;
  const key = a => ((a.brand || "") + "|" + a.name).toLowerCase();
  tpl.toBuy = tpl.toBuy.filter(x => x.id !== id);
  const re = b.restock && tpl.products.find(x => x.id === b.restock);
  let msg;
  if (re) { delete re.finished; msg = `Restocked ${re.name}. It's back in use in Skin Diary.` }
  else if (tpl.products.some(x => !x.oneOff && key(x) === key(b))) msg = `Bought ${b.name}. It's already on your shelf.`;
  else { tpl.products.push({ id: "p_" + uid(), name: b.name, brand: b.brand, step: b.step, kinds: b.kinds || [], ...(b.icon ? { icon: b.icon } : {}) }); msg = `Bought ${b.name}. It's on your Skin Diary shelf now; add it to your routine there.` }
  writeJSON(KEYS.skin, d); return msg;
}

      ${isNew ? `<label class="f">What<input class="input" data-pay="name" value="${esc(x.name)}" placeholder="e.g. Coffee beans"></label>` : `<h2>${esc(x.name)}</h2>`}
      ${qpFields({ qty: x.qty ?? 1, price: x.price, total: x.total }, null)}
      ${isNew ? `<label class="f">Date<input class="input" type="date" data-pay="on" value="${x.on}" max="${todayKey()}"></label>` : ""}
      <label class="f">Category<div class="seg">${GROUP_ORDER.map(k => `<button class="chip" style="--c:var(--g-${k})" data-act="pay-group" data-g="${k}" aria-pressed="${x.group === k}"><span class="dot"></span>${GROUPS[k]}</button>`).join("")}</div></label>
      <div class="row">${isNew ? "" : `<button class="btn ghost spacer" data-act="pay-del">Delete</button>`}<button class="btn primary" data-act="${isNew ? "pay-add" : "close"}">${isNew ? "Add" : "Done"}</button></div>`;
  } else if (sheet.type === "settings") {
    const s = mine.settings, has = { household: !!householdData(), skin: !!skinData(), meals: !!mealsData() };
    const status = k => has[k] ? "" : " Not found on this device yet.";
    body = `<h2>What goes on the list</h2>
      <div><div class="setting"><span><span class="nm">Household Diary</span><br><span class="sub">Supplies marked running low, and things added to its shopping list.${status("household")}</span></span><input type="checkbox" class="switch" data-act="set" data-k="household"${s.household ? " checked" : ""} aria-label="Household Diary"></div>
      <div class="setting"><span><span class="nm">Skin Diary</span><br><span class="sub">The To buy list: products to repurchase and ones you want to try.${status("skin")}</span></span><input type="checkbox" class="switch" data-act="set" data-k="skin"${s.skin ? " checked" : ""} aria-label="Skin Diary"></div>
      <div class="setting wide"><span><span class="nm">Meal Planner</span><br><span class="sub">Groceries for the meals you planned.${status("meals")}</span></span>
        <div class="seg">${[["rest", "This week"], ["next", "Next week"], ["off", "Off"]].map(([k, l]) => `<button class="chip" data-act="meals" data-v="${k}" aria-pressed="${s.meals === k}">${l}</button>`).join("")}</div></div></div>
      <label class="f">Currency<input class="input" data-act="currency" value="${esc(s.currency || "")}" placeholder="RSD" maxlength="6" style="max-width:140px"></label>
      <div class="row"><button class="btn primary" data-act="close">Done</button></div>`;
  }
  root.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${body}</div></div>`;
}
function qpFields(m, last) {
  return `<div class="qp"><label class="f">Quantity<span class="stepper"><button type="button" data-act="qty" data-d="-1" aria-label="One less">−</button><input class="input" inputmode="decimal" data-qp="qty" value="${fmtN(m.qty)}" aria-label="Quantity"><button type="button" data-act="qty" data-d="1" aria-label="One more">+</button></span></label>
    <label class="f">Price each, ${esc(mine.settings.currency || "")}<input class="input" inputmode="decimal" data-qp="price" value="${m.price == null ? "" : fmtN(m.price).replace(/,/g, "")}" placeholder="${last == null ? "0" : fmtN(last).replace(/,/g, "")}"></label></div>
    <p class="total-line" id="qpTotal">${totalLine(m.qty, m.price)}</p>`;
}
const totalLine = (q, p) => p == null ? `<span>Add a price to track spending</span>` : `${money(r2(q * p))} <span>total</span>`;
/* Typing in the quantity or price fields saves straight away, to the list item or to the purchase. */
function qpChanged() {
  const root = $("#sheetRoot"), qEl = root.querySelector("[data-qp=qty]"), pEl = root.querySelector("[data-qp=price]"); if (!qEl) return;
  const q = num(qEl.value) ?? 1, p = pEl.value.trim() === "" ? null : num(pEl.value);
  if (sheet.type === "item") {
    const i = gather().items.find(x => x.id === sheet.id); if (!i) return;
    mine.meta[sheet.id] = { qty: q, ...(p != null ? { price: p } : {}) }; if (q === 1 && p == null) delete mine.meta[sheet.id];
    saveMine(); render();
  } else if (sheet.type === "pay") {
    const x = sheet.id === "new" ? sheet.draft : mine.log.find(x => x.id === sheet.id); if (!x) return;
    x.qty = q; x.price = p; x.total = p == null ? null : r2(q * p);
    if (sheet.id !== "new") { if (p != null) mine.prices[pkey(x.name)] = p; saveMine(); render() }
  }
  root.querySelector("#qpTotal").innerHTML = totalLine(q, p);
}
function removeItem(id) {
  const [kind, ...rest] = id.split(":"), ref = rest.join(":"), i = gather().items.find(x => x.id === id); if (!i) return;
  const undo = snapshot(...[{ h: KEYS.household, hx: KEYS.household, s: KEYS.skin, m: KEYS.meals, mx: KEYS.meals }[kind], KEYS.mine].filter(Boolean));
  if (kind === "h") { const d = readJSON(KEYS.household), s = d.supplies[ref]; delete s.low; delete s.lowSince; writeJSON(KEYS.household, d) }
  else if (kind === "hx") { const d = readJSON(KEYS.household); delete d.shopping[ref]; writeJSON(KEYS.household, d) }
  else if (kind === "s") { const d = readJSON(KEYS.skin); d.template.toBuy = (d.template.toBuy || []).filter(x => x.id !== ref); writeJSON(KEYS.skin, d) }
  else if (kind === "m" || kind === "mx") tickItem(id);
  else if (kind === "o") delete mine.items[ref];
  if (kind !== "m" && kind !== "mx") { delete mine.meta[id]; saveMine() }
  closeSheet();
  if (kind !== "m" && kind !== "mx") { render(); toast(`Took ${i.name} off the list.`, undo) }
}

/* ---------- share ---------- */
function listText() {
  const items = gather().items;
  return GROUP_ORDER.filter(k => items.some(i => i.group === k)).map(k => `${GROUPS[k]}:\n` + items.filter(i => i.group === k).sort((a, b) => (a.sort - b.sort) || a.name.localeCompare(b.name)).map(i => { const m = metaOf(i); return `• ${i.name}${m.qty !== 1 ? " × " + fmtN(m.qty) : ""}${i.amount ? " — " + i.amount : ""}${m.total != null ? " (" + money(m.total) + ")" : ""}` }).join("\n")).join("\n\n");
}
async function share() {
  const text = listText(); if (!text) { toast("The list is empty."); return }
  if (navigator.share) { try { await navigator.share({ title: "Shopping list", text }); return } catch (e) { if (e.name === "AbortError") return } }
  try { await navigator.clipboard.writeText(text); toast("Copied the list. Paste it into a note or message.") } catch (e) { toast("Couldn't copy the list on this device.") }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const root = $("#toastRoot"); clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}</div>`;
  root.querySelector("[data-act=undo]")?.addEventListener("click", () => { root.innerHTML = ""; undo() });
  toastTimer = setTimeout(() => root.innerHTML = "", undo ? 6000 : 3500);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "scrim") { if (e.target === el) closeSheet(); return }
  if (act === "tick") return;
  if (act === "filter") { filter = el.dataset.f; render() }
  else if (act === "open") openSheet({ type: "item", id });
  else if (act === "tick-sheet") { closeSheet(); tickItem(id) }
  else if (act === "remove") removeItem(id);
  else if (act === "move") { const x = mine.items[id.slice(2)]; if (x) { x.group = el.dataset.g; saveMine(); render(); renderSheet() } }
  else if (act === "low") householdLow(id);
  else if (act === "settings") openSheet({ type: "settings" });
  else if (act === "meals") { mine.settings.meals = el.dataset.v; saveMine(); render(); renderSheet() }
  else if (act === "close") closeSheet();
  else if (act === "view") { view = el.dataset.v; closeSheet(); render(); scrollTo(0, 0) }
  else if (act === "month") { monthOff = Math.min(0, monthOff + +el.dataset.d); spendGroup = null; render() }
  else if (act === "spend-group") { spendGroup = spendGroup === el.dataset.g ? null : el.dataset.g; render() }
  else if (act === "pay") { if (id) openSheet({ type: "pay", id }) }
  else if (act === "new-pay") openSheet({ type: "pay", id: "new", draft: { name: "", group: "other", qty: 1, price: null, total: null, on: todayKey(), src: "mine", picked: false } })
  else if (act === "qty") { const q = $("#sheetRoot [data-qp=qty]"); q.value = fmtN(Math.max(1, Math.round((num(q.value) ?? 1) + +el.dataset.d))); qpChanged() }
  else if (act === "pay-group") {
    const x = sheet.id === "new" ? sheet.draft : mine.log.find(x => x.id === sheet.id); if (!x) return;
    x.group = el.dataset.g; x.picked = true; if (sheet.id !== "new") { saveMine(); render() }
    el.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === el));
  }
  else if (act === "pay-del") {
    const undo = snapshot(KEYS.mine), x = mine.log.find(x => x.id === sheet.id);
    mine.log = mine.log.filter(y => y.id !== sheet.id); saveMine(); closeSheet(); render(); toast(`Deleted ${x?.name || "the purchase"}.`, undo);
  }
  else if (act === "pay-add") {
    const d = sheet.draft; if (!d.name.trim()) { $("#sheetRoot [data-pay=name]").focus(); return }
    const undo = snapshot(KEYS.mine), { picked, ...x } = d;
    mine.log = [{ ...x, id: uid(), name: cap(d.name.trim()), at: Date.now() }, ...mine.log].sort((a, b) => b.on.localeCompare(a.on) || b.at - a.at).slice(0, 3000);
    if (x.price != null) mine.prices[pkey(d.name)] = x.price;
    saveMine(); closeSheet(); render(); toast(`Added ${cap(d.name.trim())} to ${monthLabel(x.on.slice(0, 7)).split(" ")[0]}.`, undo);
  }
  else if (act === "share") share();
  else if (act === "theme") setTheme(THEMES[(THEMES.indexOf(themeNow()) + 1) % 3]);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "tick" && el.checked) { const li = el.closest(".item"); li?.classList.add("done"); setTimeout(() => tickItem(el.dataset.id), 220) }
  if (el.dataset.pay === "on" && sheet?.draft) sheet.draft.on = el.value || todayKey();
  if (el.dataset.qp) { const q = num(el.value); if (el.dataset.qp === "qty" && (q == null || q === 0)) { el.value = "1"; qpChanged() } }
  if (el.dataset.act === "set") { mine.settings[el.dataset.k] = el.checked; saveMine(); render() }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.qp) qpChanged();
  if (el.dataset.pay && sheet?.type === "pay" && sheet.id === "new") { sheet.draft[el.dataset.pay] = el.value; if (el.dataset.pay === "name" && !sheet.draft.picked) { sheet.draft.group = guessGroup(el.value); $("#sheetRoot").querySelectorAll("[data-act=pay-group]").forEach(c => c.setAttribute("aria-pressed", c.dataset.g === sheet.draft.group)) } }
  if (el.dataset.act === "currency") { mine.settings.currency = el.value.trim(); saveMine(); render() }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet() });
const input = $("#addInput");
input.addEventListener("input", () => { const v = input.value.trim(); $("#guess").innerHTML = v ? `<span class="dot" style="--c:var(--g-${guessGroup(v)})"></span>${GROUPS[guessGroup(v)]}` : "" });
document.querySelector("[data-form=add]").addEventListener("submit", e => {
  e.preventDefault(); const v = input.value.trim(); if (!v) return;
  v.split(/\s*[,;\n]\s*/).filter(Boolean).forEach(n => addMine(cap(n)));
  input.value = ""; $("#guess").innerHTML = "";
});
/* Stay in step with the other apps: re-read when one of them saves (another tab) or when coming back to this app. */
addEventListener("storage", e => { if (e.key === THEME_KEY) applyTheme(); else if (Object.values(KEYS).includes(e.key)) { if (e.key === KEYS.mine) loadMine(); render(); if (sheet) renderSheet() } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadMine(); render(); if (sheet) renderSheet() } });
addEventListener("pageshow", e => { if (e.persisted) { loadMine(); render() } });

applyTheme(); loadMine(); render();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
